[project]
name = "mealchemy-engine"
version = "0.1.0"
description = "Mealchemy recommendation engine."
requires-python = ">=3.12"

dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
