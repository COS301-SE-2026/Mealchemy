spring.application.name=mealchemy-backend

# Cloud Run injects port, use that port if set, otherwise default is 8080
server.port=${PORT:8080}

# Database credentials
#either read from env varibles from Cloud run or fallback to local env credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mealchemy_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mealchemy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon fine tuning for free quota
# 30s timeout
# 30s keep alive timer
# max 5 simultanous connections app will ever open
# shrink to 0 idle connections when nothing is happening
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

#for Flyway integration runs at startup
#Cloud Run set to false, has separate migrate job. 
#loaclly set to true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator exposes /actuator/health used by the Dockerfile HEALTHCHECK
# rollback calls this for backend revision
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

#JWT, no fallback
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

#gcp Recipe photo storage
recipe.photo.bucket-name=${RECIPE_PHOTO_BUCKET:}
recipe.photo.signing-service-account=${RECIPE_PHOTO_SIGNING_SERVICE_ACCOUNT:}
recipe.photo.upload-url-expiry=10m
recipe.photo.max-file-size=5MB

# OpenAPI / Swagger UI
# Spec: /v3/api-docs
#UI: /swagger-ui.html
#swagger available now for deployed environments
# Set SPRINGDOC_ENABLED=false in an environment to disable both endpoints.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# USDA External API 
usda.api.base-url=https://api.nal.usda.gov/fdc/v1
usda.api.key=${USDA_API_KEY}

# Recommendation engine connection.
# In Cloud Run, ENGINE_URL is the private engine service URL and therefore also the Google ID-token audience.
engine.url=${ENGINE_URL:http://localhost:8000}
engine.timeout-ms=${ENGINE_TIMEOUT_MS:5000}
