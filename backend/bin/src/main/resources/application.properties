spring.application.name=mealchemy-backend

# Database, values overridden by environment variables in CI and Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mealchemy_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mealchemy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator exposes /actuator/health used by the Dockerfile HEALTHCHECK
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


#file to  configure any springboot behaviour and databse connection

# JWT Properties
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}