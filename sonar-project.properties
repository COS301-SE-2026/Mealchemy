# Sonar exclusions for files that should not be analyzed.
# Duplication-detection only — seed SQL files are intentionally repetitive.


#controls copy paste detection, will still be analyzed but duplicated code blocks won't be penalized for db
sonar.cpd.exclusions=**/database/**

sonar.exclusions=\
  **/database/*.sql,\
  **/database/**/*.sql,\
  frontend/android/app/src/main/res/drawable*/**,\
  frontend/android/app/src/main/res/values*/**,\
  frontend/android/app/src/main/res/mipmap*/**,\
  frontend/android/**,\
  frontend/macos/Runner/**,\
  frontend/macos/Flutter/**,\
  frontend/ios/Runner/**,\
  frontend/ios/RunnerTests/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/build/**
