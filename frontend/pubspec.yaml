name: mealchemy
description: Mealchemy - Intelligent Recipe Management and Discovery App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1   # was ^3.3.1, this version caused issues
  # Networking, auth
  dio: ^5.7.0
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^10.2.0
  # Navigation
  go_router: ^17.2.3
  # Models (paired with freezed/json_serializable in dev_dependencies)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

