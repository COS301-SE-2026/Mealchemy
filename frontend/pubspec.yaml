name: mealchemy
description: Mealchemy - Intelligent Recipe Management and Discovery App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1   # was ^3.3.1, this version caused issues
  # Networking, auth
  dio: ^5.7.0
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^10.2.0
  #images
  image_picker: ^1.2.3
  # Navigation
  go_router: ^17.2.3
  #Fonts
  google_fonts: ^6.2.1
  # Models (paired with freezed/json_serializable in dev_dependencies)
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icon generation
# run with: dart run flutter_launcher_icons
# Regenerate any time the source icon changes.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  # min_sdk_android 21 skips adaptive icons so the whole logo-mark shows at full size
  min_sdk_android: 21
  remove_alpha_ios: true
