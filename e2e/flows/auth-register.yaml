appId: com.mealchemy.mealchemy
name: Register and land on preferences
---

- launchApp:
    clearState: true

# Login screen is the app's initial location.
- assertVisible: "Welcome Back"

# Bottom of login has a "Create Account" text button that goes to signup.
- tapOn: "Create Account"

# We are on signup once the "Display Name" label is visible.
- assertVisible: "Display Name"
- waitForAnimationToEnd

- tapOn:
    below: "Display Name"
- inputText: "E2E Test User"
- hideKeyboard
- waitForAnimationToEnd

# Generate a unique email each run so reruns do not hit the unique constraint.
- evalScript: ${output.email = 'e2e-' + Date.now() + '@test.mealchemy.local'}

- tapOn:
    below: "Email Address"
- inputText: ${output.email}
- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    below: "Password"
- inputText: "E2eTestPass!123"
- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    below: "Confirm Password"
- inputText: "E2eTestPass!123"
- hideKeyboard
- waitForAnimationToEnd

#for ci 
- scrollUntilVisible:
    element:
      text: "Create Account"
      below: "Confirm Password"
    direction: DOWN
    timeout: 10000

- tapOn:
    text: "Create Account"
    below: "Confirm Password"

#increase time for ci
- extendedWaitUntil:
    visible: "Bespoke Culinary Profile"
    timeout: 20000

- assertNotVisible: "Welcome Back"
